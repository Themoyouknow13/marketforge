$schema: https://json-schema.org/draft/2020-12/schema
$title: MarketForge Run Bundle
type: object
required: [run, sources, evidence, claims, article]
additionalProperties: false
properties:
  run:
    type: object
    required: [run_id, as_of, mode]
    properties:
      run_id: {type: string, minLength: 1}
      as_of: {type: string, format: date-time}
      mode: {enum: [premarket, intraday, daily_close, weekend]}
  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, url, title, publisher, tier, retrieved_at, snapshot_path, content_sha256]
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        title: {type: string}
        publisher: {type: string}
        tier: {type: integer, minimum: 1, maximum: 3}
        retrieved_at: {type: string, format: date-time}
        snapshot_path: {type: string}
        content_sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
  evidence:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, source_id, kind, locator]
      properties:
        id: {type: string}
        source_id: {type: string}
        kind: {enum: [quote, xbrl_fact, market_observation, calculation_input]}
        quote: {type: string}
        value: {}
        locator:
          type: object
          properties:
            section: {type: string}
            page: {type: integer}
            note: {type: string}
            accession: {type: string}
            xpath: {type: string}
            json_pointer: {type: string}
  claims:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, text, claim_type, evidence_ids, as_of]
      properties:
        id: {type: string}
        text: {type: string}
        claim_type: {enum: [fact, calculation, interpretation, simulation]}
        evidence_ids: {type: array, minItems: 1, items: {type: string}}
        as_of: {type: string, format: date-time}
        confidence: {type: number, minimum: 0, maximum: 1}
        calculation: {type: object}
        simulation: {type: object}
  article:
    type: object
    required: [title, summary, summary_claim_ids, sections, disclaimer]
    properties:
      title: {type: string}
      summary: {type: string}
      summary_claim_ids: {type: array, minItems: 1, items: {type: string}}
      sections:
        type: array
        items:
          type: object
          required: [heading, paragraphs]
          properties:
            heading: {type: string}
            paragraphs:
              type: array
              items:
                type: object
                required: [text, claim_ids]
                properties:
                  text: {type: string}
                  claim_ids: {type: array, minItems: 1, items: {type: string}}
      disclaimer: {type: string, minLength: 1}
  x_thread:
    type: object
    properties:
      posts:
        type: array
        items:
          type: object
          required: [sequence, text, claim_ids]
          properties:
            sequence: {type: integer, minimum: 1}
            text: {type: string}
            claim_ids: {type: array, minItems: 1, items: {type: string}}
